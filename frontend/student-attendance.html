<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EventMate - My Attendance</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7ff, #eef1ff);
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 28px 6%;
            box-shadow: 0 5px 20px rgba(70, 60, 130, 0.2);
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .brand p {
            font-size: 14px;
            opacity: 0.85;
        }

        .back-btn {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(50,50,100,0.08);
            margin-bottom: 25px;
        }

        .welcome h2 {
            color: #292d3e;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #777;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 22px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(50,50,100,0.07);
        }

        .stat h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .stat p {
            color: #777;
            font-size: 14px;
        }

        .total {
            color: #667eea;
        }

        .present {
            color: #20a464;
        }

        .percentage {
            color: #764ba2;
        }

        .attendance-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(50,50,100,0.08);
            overflow: hidden;
        }

        .card-header {
            padding: 22px 25px;
            border-bottom: 1px solid #eee;
        }

        .card-header h3 {
            font-size: 19px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9ff;
            color: #666;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 17px 15px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #fafbff;
        }

        .status {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .status-present {
            background: #e8f8ef;
            color: #16834d;
        }

        .status-absent {
            background: #ffecee;
            color: #c92d3b;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty h3 {
            margin-bottom: 8px;
        }

        .empty p {
            color: #888;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 700px) {

            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .attendance-card {
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="brand">

            <h1>
                🎓 EventMate
            </h1>

            <p>
                My Attendance
            </p>

        </div>

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Dashboard
        </button>

    </div>

</header>


<div class="container">


    <div class="welcome">

        <h2 id="studentName">
            Welcome
        </h2>

        <p>
            Here you can view your attendance
            for all registered events.
        </p>

    </div>


    <div
        class="stats"
        id="stats"
        style="display:none;"
    >

        <div class="stat">

            <h2
                class="total"
                id="totalCount"
            >
                0
            </h2>

            <p>
                Total Events
            </p>

        </div>


        <div class="stat">

            <h2
                class="present"
                id="presentCount"
            >
                0
            </h2>

            <p>
                Present
            </p>

        </div>


        <div class="stat">

            <h2
                class="percentage"
                id="percentage"
            >
                0%
            </h2>

            <p>
                Attendance Percentage
            </p>

        </div>

    </div>


    <div
        class="attendance-card"
        id="attendanceCard"
    >

        <div class="loading">

            ⏳ Loading attendance...

        </div>

    </div>


</div>


<script>

    const API_URL =
        "http://localhost:5000";


    function checkLogin() {

        const token =
            localStorage.getItem("token");

        const userString =
            localStorage.getItem("user");


        if (!token || !userString) {

            alert(
                "Please login first."
            );

            window.location.href =
                "login.html";

            return false;
        }


        try {

            const user =
                JSON.parse(userString);


            document.getElementById(
                "studentName"
            ).textContent =
                `Welcome, ${user.name}`;


            return true;

        } catch (error) {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            window.location.href =
                "login.html";

            return false;
        }

    }


    async function loadAttendance() {

        const token =
            localStorage.getItem("token");


        const card =
            document.getElementById(
                "attendanceCard"
            );


        try {

            const response =
                await fetch(
                    `${API_URL}/attendance/my`,
                    {
                        method: "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }
                    }
                );


            const attendance =
                await response.json();


            if (!response.ok) {

                if (
                    attendance.message ===
                    "Invalid or expired token"
                ) {

                    alert(
                        "Your session has expired. Please login again."
                    );

                    localStorage.removeItem(
                        "token"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    window.location.href =
                        "login.html";

                    return;
                }


                throw new Error(
                    attendance.message ||
                    "Unable to load attendance"
                );

            }


            if (
                !attendance ||
                attendance.length === 0
            ) {

                document.getElementById(
                    "stats"
                ).style.display =
                    "none";


                card.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📊
                        </div>

                        <h3>
                            No Attendance Records
                        </h3>

                        <p>
                            Your attendance records
                            will appear here.
                        </p>

                    </div>

                `;

                return;
            }


            let present = 0;


            attendance.forEach(record => {

                if (
                    record.status ===
                    "Present"
                ) {

                    present++;

                }

            });


            const total =
                attendance.length;


            const percentage =
                Math.round(
                    (present / total) * 100
                );


            document.getElementById(
                "totalCount"
            ).textContent =
                total;


            document.getElementById(
                "presentCount"
            ).textContent =
                present;


            document.getElementById(
                "percentage"
            ).textContent =
                `${percentage}%`;


            document.getElementById(
                "stats"
            ).style.display =
                "grid";


            let html = `

                <div class="card-header">

                    <h3>
                        📋 Attendance History
                    </h3>

                </div>

                <table>

                    <thead>

                        <tr>

                            <th>#</th>
                            <th>Event</th>
                            <th>Venue</th>
                            <th>Date</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            attendance.forEach(
                (record, index) => {

                    const event =
                        record.event;


                    const date =
                        new Date(
                            event.date
                        ).toLocaleDateString(
                            "en-IN"
                        );


                    const statusClass =
                        record.status ===
                        "Present"
                            ? "status-present"
                            : "status-absent";


                    const icon =
                        record.status ===
                        "Present"
                            ? "✓"
                            : "✕";


                    html += `

                        <tr>

                            <td>
                                ${index + 1}
                            </td>

                            <td>
                                <strong>
                                    ${event.title}
                                </strong>
                            </td>

                            <td>
                                ${event.venue}
                            </td>

                            <td>
                                ${date}
                            </td>

                            <td>

                                <span
                                    class="status ${statusClass}"
                                >
                                    ${icon}
                                    ${record.status}
                                </span>

                            </td>

                        </tr>

                    `;

                }
            );


            html += `

                    </tbody>

                </table>

            `;


            card.innerHTML =
                html;


        } catch (error) {

            console.error(error);


            card.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        Something went wrong
                    </h3>

                    <p>
                        ${error.message}
                    </p>

                </div>

            `;

        }

    }


    function goBack() {

        window.location.href =
            "homepage1.html";

    }


    if (checkLogin()) {

        loadAttendance();

    }

</script>


</body>

</html>
