<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UniVents - Manage Events</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        header {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-bar h2 {
            color: #333;
        }

        .back-btn {
            background: #555;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.08);
        }

        .form-container h2 {
            margin-top: 0;
            color: #333;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea,
        select {
            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-container {
            margin-top: 20px;
        }

        .primary-btn {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            border: none;

            padding: 12px 22px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .secondary-btn {
            background: #777;

            color: white;

            border: none;

            padding: 12px 22px;

            border-radius: 7px;

            cursor: pointer;

            margin-left: 8px;
        }

        .events-container {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 20px;
        }

        .event-card {
            background: white;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.08);
        }

        .event-card h3 {
            color: #333;
            margin-top: 0;
        }

        .event-card p {
            color: #666;
            line-height: 1.5;
        }

        .event-card strong {
            color: #333;
        }

        .edit-btn {
            background: #667eea;

            color: white;

            border: none;

            padding: 9px 15px;

            border-radius: 6px;

            cursor: pointer;

            margin-right: 5px;
        }

        .delete-btn {
            background: #dc3545;

            color: white;

            border: none;

            padding: 9px 15px;

            border-radius: 6px;

            cursor: pointer;
        }

        .edit-btn:hover,
        .delete-btn:hover,
        .primary-btn:hover,
        .secondary-btn:hover,
        .back-btn:hover {
            opacity: 0.9;
        }

        .no-events {
            background: white;

            padding: 40px;

            text-align: center;

            border-radius: 12px;

            grid-column: 1 / -1;
        }

        #message {
            text-align: center;

            font-weight: bold;

            margin: 20px 0;
        }

    </style>

</head>


<body>


<header>

    <h1>UniVents Admin</h1>

    <p>Manage College Events</p>

</header>


<div class="container">


    <div class="top-bar">

        <h2>Event Management</h2>

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Admin Dashboard
        </button>

    </div>


    <!-- CREATE / UPDATE EVENT FORM -->

    <div class="form-container">

        <h2 id="formTitle">
            Create New Event
        </h2>


        <form id="eventForm">


            <div class="form-grid">


                <div class="form-group">

                    <label for="title">
                        Event Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                        placeholder="Enter event title"
                    >

                </div>


                <div class="form-group">

                    <label for="venue">
                        Venue
                    </label>

                    <input
                        type="text"
                        id="venue"
                        required
                        placeholder="Enter venue"
                    >

                </div>


                <div class="form-group">

                    <label for="date">
                        Event Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Cultural Event">
                            Cultural Event
                        </option>

                        <option value="Technical Event">
                            Technical Event
                        </option>

                        <option value="Sports Event">
                            Sports Event
                        </option>

                        <option value="Academic Event">
                            Academic Event
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="image">
                        Image
                    </label>

                    <input
                        type="text"
                        id="image"
                        placeholder="example.jpg"
                    >

                </div>


                <div class="form-group">

                    <label for="registerLink">
                        Register Link
                    </label>

                    <input
                        type="text"
                        id="registerLink"
                        placeholder="event-registration.html"
                    >

                </div>

<div class="form-group">

    <label for="eventFee">
        Event Fee (₹)
    </label>

    <input
        type="number"
        id="eventFee"
        min="0"
        step="1"
        placeholder="Enter event fee"
        value="0"
    >

</div>

                <div class="form-group full">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        required
                        placeholder="Enter event description"
                    ></textarea>

                </div>


            </div>


            <div class="button-container">

                <button
                    type="submit"
                    class="primary-btn"
                    id="submitButton"
                >
                    Create Event
                </button>


                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelButton"
                    onclick="resetForm()"
                    style="display: none;"
                >
                    Cancel Edit
                </button>

            </div>


        </form>

    </div>


    <div id="message"></div>


    <h2>All Events</h2>


    <div
        id="eventsContainer"
        class="events-container"
    >

        <div class="no-events">
            Loading events...
        </div>

    </div>


</div>


<script>


    /*
     * Backend URL
     */

    const API_URL =
        "http://localhost:5000";


    /*
     * Currently editing event ID
     */

    let editingEventId = null;


    /*
     * Check admin
     */

    function checkAdmin() {

        const token =
            localStorage.getItem("token");

        const userString =
            localStorage.getItem("user");


        if (!token || !userString) {

            alert("Please login first.");

            window.location.href =
                "login.html";

            return false;
        }


        const user =
            JSON.parse(userString);


        const role =
            String(user.role)
                .trim()
                .toLowerCase();


        if (role !== "admin") {

            alert("Access denied. Admin only.");

            window.location.href =
                "homepage1.html";

            return false;
        }


        return true;
    }


    /*
     * Get authorization header
     */

    function getHeaders() {

        const token =
            localStorage.getItem("token");


        return {

            "Content-Type":
                "application/json",

            "Authorization":
                `Bearer ${token}`

        };

    }


    /*
     * Load all events
     */

    async function loadEvents() {

        try {

            const response =
                await fetch(
                    `${API_URL}/events`
                );


            const events =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    events.message ||
                    "Unable to load events"
                );

            }


            displayEvents(events);


        } catch (error) {

            console.error(error);

            document.getElementById(
                "eventsContainer"
            ).innerHTML = `

                <div class="no-events">

                    <h3>
                        Unable to load events
                    </h3>

                    <p>
                        ${error.message}
                    </p>

                </div>

            `;

        }

    }


    /*
     * Display events
     */

    function displayEvents(events) {

        const container =
            document.getElementById(
                "eventsContainer"
            );



        if (!events || events.length === 0) {

            container.innerHTML = `

                <div class="no-events">

                    <h3>
                        No events found
                    </h3>

                    <p>
                        Create your first event above.
                    </p>

                </div>

            `;

            return;
        }


        container.innerHTML = "";


        events.forEach(event => {

            const eventDate =
                new Date(event.date)
                    .toLocaleDateString(
                        "en-IN",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }




                    );


            container.innerHTML += `

                <div class="event-card">

                    <h3>
                        ${event.title}
                    </h3>

                    <p>
                        ${event.description}
                    </p>

                    <p>
                        <strong>Venue:</strong>
                        ${event.venue}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${eventDate}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${event.category}
                    </p>
                    


                    <p>
    <strong>Event Fee:</strong>
    ₹${event.eventFee ?? 0}
</p>

                    <p>
                        <strong>Image:</strong>
                        ${event.image || "None"}
                    </p>

                    <p>
                        <strong>Register Link:</strong>
                        ${event.registerLink || "None"}
                    </p>


                    <div>

                        <button
                            class="edit-btn"
                            onclick="editEvent('${event._id}')"
                        >
                            Edit
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteEvent('${event._id}')"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            `;

        });

    }


    /*
     * Create / Update Event
     */

    document
        .getElementById("eventForm")
        .addEventListener(
            "submit",
            async function(e) {

                e.preventDefault();


                const eventData = {

                    title:
                        document
                            .getElementById("title")
                            .value
                            .trim(),

                    description:
                        document
                            .getElementById("description")
                            .value
                            .trim(),

                    venue:
                        document
                            .getElementById("venue")
                            .value
                            .trim(),

                    date:
                        document
                            .getElementById("date")
                            .value,

                    category:
                        document
                            .getElementById("category")
                            .value,

                    image:
                        document
                            .getElementById("image")
                            .value
                            .trim(),

                    registerLink:
                        document
                            .getElementById("registerLink")
                            .value
                            .trim(),
                    eventFee:
                         Number(  
                           document
            .getElementById("eventFee")
            .value
    ) || 0,      

                };


                try {

                    let response;


                    /*
                     * UPDATE
                     */

                    if (editingEventId) {

                        response =
                            await fetch(
                                `${API_URL}/events/${editingEventId}`,
                                {
                                    method: "PUT",

                                    headers:
                                        getHeaders(),

                                    body:
                                        JSON.stringify(
                                            eventData
                                        )
                                }
                            );

                    }

                    /*
                     * CREATE
                     */

                    else {

                        response =
                            await fetch(
                                `${API_URL}/events`,
                                {
                                    method: "POST",

                                    headers:
                                        getHeaders(),

                                    body:
                                        JSON.stringify(
                                            eventData
                                        )
                                }
                            );

                    }


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(
                            data.message ||
                            "Operation failed",
                            "red"
                        );

                        return;
                    }


                    showMessage(

                        editingEventId
                            ? "Event updated successfully!"
                            : "Event created successfully!",

                        "green"

                    );


                    resetForm();

                    loadEvents();


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "Unable to connect to server.",
                        "red"
                    );

                }

            }
        );


    /*
     * Edit event
     */

    async function editEvent(eventId) {

        try {

            const response =
                await fetch(
                    `${API_URL}/events/${eventId}`
                );


            const event =
                await response.json();


            if (!response.ok) {

                alert(
                    event.message ||
                    "Unable to get event"
                );

                return;
            }


            editingEventId =
                event._id;


            document.getElementById(
                "title"
            ).value =
                event.title || "";


            document.getElementById(
                "description"
            ).value =
                event.description || "";


            document.getElementById(
                "venue"
            ).value =
                event.venue || "";


            /*
             * Convert date to YYYY-MM-DD
             */

            document.getElementById(
                "date"
            ).value =
                event.date
                    ? event.date.substring(0, 10)
                    : "";


            document.getElementById(
                "category"
            ).value =
                event.category || "";


            document.getElementById(
                "image"
            ).value =
                event.image || "";


            document.getElementById(
                "registerLink"
            ).value =
                event.registerLink || "";


               document.getElementById(
    "eventFee"
).value =
    event.eventFee ?? 0; 


            document.getElementById(
                "formTitle"
            ).textContent =
                "Update Event";


            document.getElementById(
                "submitButton"
            ).textContent =
                "Update Event";


            document.getElementById(
                "cancelButton"
            ).style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {

            console.error(error);

            alert(
                "Unable to load event."
            );

        }

    }


    /*
     * Delete event
     */

    async function deleteEvent(eventId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this event?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `${API_URL}/events/${eventId}`,
                    {
                        method: "DELETE",

                        headers:
                            getHeaders()
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Unable to delete event",
                    "red"
                );

                return;
            }


            showMessage(
                "Event deleted successfully!",
                "green"
            );


            loadEvents();


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to server.",
                "red"
            );

        }

    }


    /*
     * Reset form
     */

    function resetForm() {

        editingEventId = null;


        document
            .getElementById("eventForm")
            .reset();


        document.getElementById(
            "formTitle"
        ).textContent =
            "Create New Event";


        document.getElementById(
            "submitButton"
        ).textContent =
            "Create Event";


        document.getElementById(
            "cancelButton"
        ).style.display =
            "none";

    }


    /*
     * Show message
     */

    function showMessage(
        text,
        color
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.style.color =
            color;


        message.textContent =
            text;


        setTimeout(() => {

            message.textContent = "";

        }, 3000);

    }


    /*
     * Back to admin dashboard
     */

    function goBack() {

        window.location.href =
            "admin.html";

    }


    /*
     * Start page
     */

    if (checkAdmin()) {

        loadEvents();

    }

</script>


</body>

</html>
