


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work Gallery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            color: #333;
            background-color:lab(79.45% -8.63 -27.83);
        }
        section {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease forwards;
            background-color: #e1e8ec;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
        h2 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 30px;
            text-decoration: underline;
            color: #6b5b95;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .video-container {
            text-align: center;
        }
        video {
            width: 100%;
            max-height: 220px;
            border-radius: 10px;
            box-shadow: 0 4px 14px hsla(257, 57%, 44%, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }
        video:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(107, 91, 149, 0.7);
        }
        figcaption {
            margin-top: 8px;
            font-size: 20px;
            color: hsl(257, 68%, 70%);
            font-weight: 600;
            text-decoration-line:underline;
        }
        fieldset {
            border: 2px solid #6b5b95;
            border-radius: 12px;
            padding: 20px;
            background: #fafafa;
        }
        .home-link {
            display: block;
            text-align: center;
            margin-bottom: 18px;
        }
        .home-link a {
            color: #3768c3;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        .home-link a:hover {
            color: #224e90;}
    </style>
</head>
<body>
    <div class="home-link">
            <a href="homepage1.html">&larr; Back to Home</a>
        </div>
    <section>
        <h2>Our Work Gallery</h2>
        <fieldset>
            <div class="gallery">
                <figure class="video-container">
                    <video src="video/rampwalkf.mp4" controls poster="photos/rampwalkf.jpg" aria-label="Ramp Walk Female"></video>
                    <figcaption>Ramp Walk</figcaption>
                     <figcaption>Fresher's Party</figcaption>
                </figure>
                <figure class="video-container">
                    <video src="video/dancef.mp4" controls poster="photos/fdance.jpg" aria-label="Dance Female"></video>
                    <figcaption>Dance </figcaption>
                    <figcaption>Fresher's Party</figcaption>
                </figure>
            </div>
        </fieldset>
        <fieldset>
            <div class="gallery">
                <figure class="video-container">
                    <video src="video/rampwalku.mp4" controls poster="photos/rampwalku.jpg" aria-label="Ramp Walk Male"></video>
                    <figcaption>Act</figcaption>
                    <figcaption>Udhgosh</figcaption>
                </figure>
                <figure class="video-container">
                    <video src="video/singingu.mp4" controls poster="photos/singingu.jpg" aria-label="Singing Male"></video>
                    <figcaption>Singing</figcaption>
                    <figcaption>Udhgosh</figcaption>
                </figure>
            </div>
        </fieldset>
    </section>
</body>
</html>
