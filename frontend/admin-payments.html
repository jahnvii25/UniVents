<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Payments - EventMate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        header {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        header p {
            margin: 0;
            font-size: 18px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
        }

        .summary {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 20px;

            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);
        }

        .summary-card h3 {
            margin: 0 0 10px;
            color: #777;
            font-size: 18px;
        }

        .summary-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .payments-box {
            background: white;
            border-radius: 15px;
            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);

            overflow-x: auto;
        }

        .payments-box h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f8ff;
        }

        .paid {
            display: inline-block;

            padding: 6px 14px;

            border-radius: 20px;

            background: #e8f8ef;

            color: #16834d;

            font-weight: bold;
        }

        .pending {
            display: inline-block;

            padding: 6px 14px;

            border-radius: 20px;

            background: #fff4cc;

            color: #996c00;

            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-weight: bold;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #d63031;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 28px;
            }

            .container {
                width: 95%;
            }

            th,
            td {
                font-size: 14px;
                padding: 10px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        EventMate Admin Payments
    </h1>

    <p>
        View all student payment transactions
    </p>

</header>


<div class="container">

    <a
        href="admin.html"
        class="back"
    >
        ← Back to Admin Dashboard
    </a>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <h3>
                Total Payments
            </h3>

            <div
                class="number"
                id="totalPayments"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <h3>
                Total Revenue
            </h3>

            <div
                class="number"
                id="totalRevenue"
            >
                ₹0
            </div>

        </div>


        <div class="summary-card">

            <h3>
                Successful Payments
            </h3>

            <div
                class="number"
                id="successfulPayments"
            >
                0
            </div>

        </div>

    </div>


    <!-- PAYMENTS -->

    <div class="payments-box">

        <h2>
            Payment Transactions
        </h2>


        <div id="paymentsContainer">

            <div class="loading">
                Loading payments...
            </div>

        </div>

    </div>

</div>


<script>

const API_URL =
    "http://localhost:5000";


// ==========================================
// LOAD ALL PAYMENTS
// ==========================================

async function loadPayments() {

    const token =
        localStorage.getItem("token");


    if (!token) {

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/payments/all`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const payments =
            await response.json();


        if (!response.ok) {

            throw new Error(
                payments.message ||
                "Unable to load payments"
            );

        }


        displayPayments(
            payments
        );


    } catch (error) {

        console.error(
            "Admin payment error:",
            error
        );


        document.getElementById(
            "paymentsContainer"
        ).innerHTML = `

            <div class="error">

                ${error.message}

            </div>

        `;

    }

}


// ==========================================
// DISPLAY PAYMENTS
// ==========================================

function displayPayments(
    payments
) {

    const container =
        document.getElementById(
            "paymentsContainer"
        );


    const totalPayments =
        payments.length;


    const totalRevenue =
        payments.reduce(
            (total, payment) => {

                if (
                    payment.status ===
                    "Paid"
                ) {

                    return total +
                        Number(
                            payment.amount
                        );

                }

                return total;

            },
            0
        );


    const successfulPayments =
        payments.filter(
            payment =>
                payment.status === "Paid"
        ).length;


    document.getElementById(
        "totalPayments"
    ).textContent =
        totalPayments;


    document.getElementById(
        "totalRevenue"
    ).textContent =
        `₹${totalRevenue}`;


    document.getElementById(
        "successfulPayments"
    ).textContent =
        successfulPayments;


    if (
        !payments ||
        payments.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No payments found
                </h3>

                <p>
                    No student payments
                    have been recorded yet.
                </p>

            </div>

        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        Student
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Event
                    </th>

                    <th>
                        Amount
                    </th>

                    <th>
                        Payment Method
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Date
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    payments.forEach(
        payment => {

            const user =
                payment.user || {};

            const event =
                payment.event || {};


            const status =
                payment.status ||
                "Pending";


            const statusClass =
                status === "Paid"
                    ? "paid"
                    : "pending";


            const date =
                payment.createdAt
                    ? new Date(
                        payment.createdAt
                    ).toLocaleString()
                    : "-";


            html += `

                <tr>

                    <td>
                        ${
                            user.name ||
                            "Unknown"
                        }
                    </td>

                    <td>
                        ${
                            user.email ||
                            "-"
                        }
                    </td>

                    <td>
                        ${
                            event.title ||
                            "Unknown Event"
                        }
                    </td>

                    <td>
                        ₹${payment.amount}
                    </td>

                    <td>
                        ${
                            payment.paymentMethod ||
                            "Not Selected"
                        }
                    </td>

                    <td>

                        <span
                            class="${statusClass}"
                        >
                            ${status}
                        </span>

                    </td>

                    <td>
                        ${date}
                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        html;

}


// Start

loadPayments();

</script>


</body>

</html>
