<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EventMate - Registrations</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        header {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            color: #333;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn {
            background: #555;
            color: white;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
        }

        .registrations-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            color: #444;
        }

        tr:hover {
            background: #f8f8ff;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 12px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #d4edda;
            color: #155724;
            font-size: 13px;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <h1>EventMate Admin</h1>

    <p>Student Registrations</p>

</header>


<div class="container">


    <div class="top-bar">

        <h2>All Registrations</h2>

        <div>

            <button
                class="refresh-btn"
                onclick="loadRegistrations()"
            >
                🔄 Refresh
            </button>

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Dashboard
            </button>

        </div>

    </div>


    <div id="message"></div>


    <div
        id="registrationsContainer"
        class="registrations-container"
    >

        <div class="no-data">
            Loading registrations...
        </div>

    </div>


</div>


<script>


    const API_URL =
        "http://localhost:5000";


    // Check admin
    function checkAdmin() {

        const token =
            localStorage.getItem("token");

        const userString =
            localStorage.getItem("user");


        if (!token || !userString) {

            alert("Please login first.");

            window.location.href =
                "login.html";

            return false;
        }


        const user =
            JSON.parse(userString);


        const role =
            String(user.role)
                .trim()
                .toLowerCase();


        if (role !== "admin") {

            alert("Access denied. Admin only.");

            window.location.href =
                "homepage1.html";

            return false;
        }


        return true;
    }


    // Load registrations
    async function loadRegistrations() {

        const token =
            localStorage.getItem("token");


        const container =
            document.getElementById(
                "registrationsContainer"
            );


        container.innerHTML = `
            <div class="no-data">
                Loading registrations...
            </div>
        `;


        try {

            const response =
                await fetch(
                    `${API_URL}/registrations/all`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const registrations =
                await response.json();


            if (!response.ok) {

                container.innerHTML = `

                    <div class="no-data">

                        <h3>
                            Unable to load registrations
                        </h3>

                        <p>
                            ${registrations.message}
                        </p>

                    </div>

                `;

                return;
            }


            if (
                !registrations ||
                registrations.length === 0
            ) {

                container.innerHTML = `

                    <div class="no-data">

                        <h3>
                            No registrations found
                        </h3>

                        <p>
                            No students have registered
                            for events yet.
                        </p>

                    </div>

                `;

                return;
            }


            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>
                                #
                            </th>

                            <th>
                                Student Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Event
                            </th>

                            <th>
                                Venue
                            </th>

                            <th>
                                Event Date
                            </th>

                            <th>
                                Registered On
                            </th>

                        </tr>

                    </thead>

                    <tbody>
            `;


            registrations.forEach(
                (registration, index) => {

                    const user =
                        registration.user;

                    const event =
                        registration.event;


                    const eventDate =
                        event?.date
                            ? new Date(
                                event.date
                            ).toLocaleDateString(
                                "en-IN",
                                {
                                    day: "numeric",
                                    month: "long",
                                    year: "numeric"
                                }
                            )
                            : "N/A";


                    const registrationDate =
                        registration.createdAt
                            ? new Date(
                                registration.createdAt
                            ).toLocaleDateString(
                                "en-IN",
                                {
                                    day: "numeric",
                                    month: "long",
                                    year: "numeric"
                                }
                            )
                            : "N/A";


                    html += `

                        <tr>

                            <td>
                                ${index + 1}
                            </td>

                            <td>
                                <strong>
                                    ${user?.name || "N/A"}
                                </strong>
                            </td>

                            <td>
                                ${user?.email || "N/A"}
                            </td>

                            <td>
                                ${event?.title || "N/A"}
                            </td>

                            <td>
                                ${event?.venue || "N/A"}
                            </td>

                            <td>
                                ${eventDate}
                            </td>

                            <td>
                                ${registrationDate}
                            </td>

                        </tr>

                    `;

                }
            );


            html += `

                    </tbody>

                </table>

            `;


            container.innerHTML =
                html;


        } catch (error) {

            console.error(error);

            container.innerHTML = `

                <div class="no-data">

                    <h3>
                        Something went wrong
                    </h3>

                    <p>
                        Unable to connect to server.
                    </p>

                </div>

            `;

        }

    }


    // Back to dashboard
    function goBack() {

        window.location.href =
            "admin.html";

    }


    // Start page
    if (checkAdmin()) {

        loadRegistrations();

    }

</script>


</body>

</html>
