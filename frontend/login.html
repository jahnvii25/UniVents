<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniVents - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>UniVents</h1>

        <p class="subtitle">
            Login to your account
        </p>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

        <div class="signup-link">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function (e) {

                e.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                try {

                    const response = await fetch(
                        "http://localhost:5000/users/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                    const data = await response.json();


                    if (!response.ok) {

                        message.style.color = "red";

                        message.textContent =
                            data.message;

                        return;
                    }

                  
                    // Save JWT token
                // Save JWT token
localStorage.setItem("token", data.token);

// Save user information
localStorage.setItem(
    "user",
    JSON.stringify(data.user)
);

console.log("LOGIN RESPONSE:", data);
console.log("USER:", data.user);
console.log("ROLE:", data.user.role);

message.style.color = "green";

message.textContent =
    "Login successful! Role: " + data.user.role;


// Normalize role
const role =
    String(data.user.role)
        .trim()
        .toLowerCase();

console.log("FINAL ROLE:", role);


// Redirect according to role
setTimeout(() => {

    if (role === "admin") {

        console.log(
            "Redirecting to ADMIN dashboard"
        );

        window.location.href =
            "./admin.html";

    } else {

        console.log(
            "Redirecting to STUDENT homepage"
        );

        window.location.href =
            "./homepage1.html";
    }

}, 1500);
                } catch (error) {

                    console.error(error);

                    message.style.color = "red";

                    message.textContent =
                        "Unable to connect to server.";

                }

            });

    </script>

</body>

</html>
