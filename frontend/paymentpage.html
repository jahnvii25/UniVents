<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UniVents - Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .pay-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .pay-btn:hover {
            opacity: 0.9;
        }

        .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .info {
            background: #f5f6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            color: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>💳 UniVents Payment</h1>

    <p class="subtitle">
        Complete your event payment
    </p>

    <div class="info">
        Your payment will be securely recorded
        in the UniVents system.
    </div>

    <form id="paymentForm">

        <div class="form-group">

            <label for="eventId">
                Event ID
            </label>

            <input
                type="text"
                id="eventId"
                placeholder="Enter Event ID"
                required
            >

        </div>

        <div class="form-group">

            <label for="amount">
                Amount (₹)
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="1"
                required
            >

        </div>

        <div class="form-group">

            <label for="paymentMethod">
                Payment Method
            </label>

            <select
                id="paymentMethod"
                required
            >

                <option value="">
                    Select payment method
                </option>

                <option value="Card">
                    Credit / Debit Card
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Cash">
                    Cash
                </option>

            </select>

        </div>

        <button
            type="submit"
            class="pay-btn"
            id="payButton"
        >
            Pay Now
        </button>

    </form>

    <div id="message"></div>

    <a
        href="index.html"
        class="back"
    >
        ← Back to Home
    </a>

</div>


<script>

    const API_URL =
        "https://univents-0kp4.onrender.com";


    const paymentForm =
        document.getElementById(
            "paymentForm"
        );


    const payButton =
        document.getElementById(
            "payButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const eventIdFromURL =
        params.get("eventId");
    const amountFromURL =
    params.get("amount");

    if (eventIdFromURL) {

        document.getElementById(
            "eventId"
        ).value = eventIdFromURL;

    }
    if (amountFromURL) {

    document.getElementById(
        "amount"
    ).value = amountFromURL;

}


    paymentForm.addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            const token =
                localStorage.getItem(
                    "token"
                );


            if (!token) {

                alert(
                    "Please login first."
                );

                window.location.href =
                    "login.html";

                return;

            }


            const eventId =
                document.getElementById(
                    "eventId"
                ).value.trim();


            const amount =
                Number(
                    document.getElementById(
                        "amount"
                    ).value
                );


            const paymentMethod =
                document.getElementById(
                    "paymentMethod"
                ).value;


            if (!eventId) {

                alert(
                    "Please enter Event ID."
                );

                return;

            }


            if (!amount || amount <= 0) {

                alert(
                    "Please enter a valid amount."
                );

                return;

            }


            if (!paymentMethod) {

                alert(
                    "Please select a payment method."
                );

                return;

            }


            payButton.disabled = true;

            payButton.textContent =
                "Processing...";


            message.textContent = "";


            try {

                const response =
                    await fetch(
                        `${API_URL}/payments/create`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`

                            },

                            body:
                                JSON.stringify({

                                    eventId:
                                        eventId,

                                    amount:
                                        amount,

                                    paymentMethod:
                                        paymentMethod

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Payment failed"
                    );

                }


                message.style.color =
                    "green";


                message.textContent =
                    "✅ Payment created successfully!";


                alert(
                    "Payment created successfully!"
                );


                paymentForm.reset();


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Payment error:",
                    error
                );


                message.style.color =
                    "red";


                message.textContent =
                    "❌ " + error.message;


                payButton.disabled =
                    false;


                payButton.textContent =
                    "Pay Now";

            }

        }
    );

</script>

</body>

</html>
